<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <!-- SYNTHETIC demo napkin for Napkin Inc. Every fact a money question needs is on it, so the interview is short. -->
  <rect width="1200" height="1000" fill="#e6e0d0"/>
  <rect x="50" y="40" width="1100" height="920" rx="16" fill="#fbf8ee" stroke="#cfc8b4" stroke-width="3" transform="rotate(-1 600 500)"/>
  <g font-family="Bradley Hand, Marker Felt, Chalkboard SE, cursive" fill="#1f2a5a" transform="rotate(-1.2 600 500)">
    <text x="110" y="150" font-size="84" font-weight="bold">Juniper Candles</text>
